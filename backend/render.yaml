services:
  - type: web
    name: agroclima-python-2026-b
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"

      - key: ENVIRONMENT
        value: production

      - key: JWT_SECRET
        generateValue: true

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: DATABASE_URL
        sync: false