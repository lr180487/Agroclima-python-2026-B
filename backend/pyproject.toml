[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agroclima-backend"
version = "1.1.0"
description = "Backend real FastAPI + SQLAlchemy (SQLite/PostgreSQL) con OAuth2/JWT, RBAC y exportación de reportes PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
py-modules = ["main", "database", "models", "security", "pdf_generator", "envloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
