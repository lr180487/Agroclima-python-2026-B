services:
  - type: web
    name: agroclima-python-2026-b
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      uvicorn app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.14

      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"